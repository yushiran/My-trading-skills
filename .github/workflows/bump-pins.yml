name: Bump pinned upstream plugins

# Third-party plugins are pinned by sha in marketplace.json so an upstream
# change never lands unreviewed. This checks their default branch weekly,
# moves the pin, and opens an issue so the change gets read.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move pins to upstream HEAD
        id: bump
        run: |
          M=.claude-plugin/marketplace.json
          : > /tmp/changes.md
          for name in $(jq -r '.plugins[] | select(.source.sha?) | .name' "$M"); do
            url=$(jq -r --arg n "$name" '.plugins[] | select(.name==$n) | .source.url' "$M")
            old=$(jq -r --arg n "$name" '.plugins[] | select(.name==$n) | .source.sha' "$M")
            new=$(git ls-remote "$url" HEAD | cut -f1)
            if [ -n "$new" ] && [ "$new" != "$old" ]; then
              jq --arg n "$name" --arg s "$new" \
                '(.plugins[] | select(.name==$n) | .source.sha) = $s' "$M" > /tmp/m.json && mv /tmp/m.json "$M"
              repo=${url%.git}
              echo "- **$name**: \`${old:0:8}\` → \`${new:0:8}\` — [compare]($repo/compare/$old...$new)" >> /tmp/changes.md
            fi
          done
          echo "changed=$([ -s /tmp/changes.md ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git commit -m "pins: move upstream plugins to current HEAD"
          git push

      - name: Open issue
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Upstream moved; the pins in \`marketplace.json\` now point at the new commits."
            echo
            cat /tmp/changes.md
            echo
            echo "Read the compare link. If a skill was renamed, added or removed, update any"
            echo "plugin that depends on it, then run \`/plugin marketplace update yushiran-trading\`."
          } > /tmp/issue.md
          gh issue create --title "Upstream plugins updated ($(date +%F))" --body-file /tmp/issue.md
